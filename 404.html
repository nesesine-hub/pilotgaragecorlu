<!DOCTYPE html>
<html lang="tr">
<head>

<title>Sayfa bulunamadı | Pilot Garage Çorlu Kervancı Oto Center</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  :root{--red:#E1121C;--ink:#15171B;--bg:#F1F2F3;--steel:#6B7178}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;
       font-size:17px;line-height:1.6;padding:32px;text-align:center}
  .box{max-width:520px}
  .code{font-size:88px;font-weight:800;font-variation-settings:"wdth" 70;line-height:1;color:var(--red)}
  h1{margin:18px 0 0;font-size:30px;font-weight:700;font-variation-settings:"wdth" 116;letter-spacing:-.03em}
  p{margin:14px 0 0;color:#4E545B}
  .go{margin-top:28px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-flex;align-items:center;padding:13px 22px;border:2px solid var(--red);
        background:var(--red);color:#fff;text-decoration:none;font-weight:700;font-size:16px;border-radius:2px}
  a.btn.g{background:transparent;color:var(--ink);border-color:var(--ink)}
  a.btn:hover{opacity:.88}
  .tel{margin-top:26px;font-size:15px;color:var(--steel)}
  .tel a{color:var(--ink);font-weight:700}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Aradığınız sayfa burada değil</h1>
    <p>Bağlantı taşınmış ya da yanlış yazılmış olabilir. Anasayfadan devam edebilir veya doğrudan bize ulaşabilirsiniz.</p>
    <div class="go">
      <a class="btn" href="/pilotgaragecorlu/">Anasayfaya dön</a>
      <a class="btn g" href="https://wa.me/905467136656" target="_blank" rel="noopener">WhatsApp'tan yazın</a>
    </div>
    <p class="tel">Ya da arayın: <a href="tel:+905467136656">0546 713 66 56</a> · Her gün 24 saat açık</p>
  </div>
</body>
</html>
